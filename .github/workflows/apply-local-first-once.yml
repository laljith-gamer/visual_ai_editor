name: Apply local-first page wiring once

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply Phase 4 local-first page wiring') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Apply Phase 4 wiring
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          page = Path('app/editor/page.tsx')
          text = page.read_text()

          local_first_block = '''      // ---- v1.8.0 — Local-first gate (flag-gated, default OFF) --------
      // When NEXT_PUBLIC_LOCAL_FIRST_EDITOR=true, run the model-driven
      // router on-device BEFORE the cloud planner. In this v1 we only
      // ACT locally on `chat` turns (questions/explanations answered with
      // grounding) — every action decision and any low-confidence/failed/
      // unsupported case falls through to the UNCHANGED cloud path below.
      // This makes routeTurn + grounding live without risking the
      // timeline. Never throws; on any issue we proceed to cloud.
      try {
        const { tryLocalFirst, isLocalFirstEnabled } = await import(
          "@/lib/llm/localFirst"
        );
        if (isLocalFirstEnabled()) {
          const s = useEditorStore.getState();
          const lf = await tryLocalFirst({
            tier: cap.tier,
            messages: s.messages.map((m) => ({
              role: m.role,
              content: m.content
            })),
            userText: userRequest,
            videoDurationSeconds: s.videoMeta?.duration,
            timelineClipCount: s.highlights.length,
            briefing: s.lastBriefing
              ? { sourceName: s.lastBriefing.sourceName, bestParts: s.lastBriefing.bestParts }
              : null
          });
          if (lf.handled) {
            pushMessage({ role: "assistant", content: lf.message });
            setStatus("ready", undefined);
            logSession.system(
              "localfirst.handled",
              { kind: lf.kind, model: lf.model },
              `Answered locally (${lf.kind}, ${lf.model})`
            );
            setBusy(false);
            return;
          }
          logSession.system(
            "localfirst.fallthrough",
            { reason: lf.reason },
            `Local-first deferred to cloud: ${lf.reason}`
          );
        }
      } catch (err) {
        logSession.system(
          "localfirst.failed",
          { message: (err as Error).message },
          `Local-first path errored, falling back to cloud: ${(err as Error).message.slice(0, 80)}`
        );
      }
'''

          if 'localfirst.handled' not in text:
              marker = '''      try {
        setStatus("planning", "Talking to the planner");'''
              if marker not in text:
                  raise SystemExit('Could not find cloud planner try marker in app/editor/page.tsx')
              text = text.replace(marker, local_first_block + '\n' + marker, 1)

          deps_marker = '''      memory,
      pushMessage,'''
          if '      cap.tier,\n      pushMessage,' not in text:
              if deps_marker not in text:
                  raise SystemExit('Could not find handleAgent dependency marker in app/editor/page.tsx')
              text = text.replace(deps_marker, '''      memory,
      cap.tier,
      pushMessage,''', 1)

          page.write_text(text)

          env = Path('.env.example')
          env_text = env.read_text()
          local_first_env = '''# Local-first editor (Phase 4, EXPERIMENTAL). Default OFF.
# When "true", a model-driven router runs in-browser (WebGPU, @mlc-ai/web-llm)
# BEFORE the cloud planner. In v1 it only answers `chat`/question turns
# locally (with grounding); every action and any low-confidence/unsupported
# case falls through to the unchanged Gemini/Groq flow. Requires WebGPU and
# downloads a model on first use. Leave empty/false for the standard cloud flow.
NEXT_PUBLIC_LOCAL_FIRST_EDITOR=false
'''
          env_text = env_text.replace('\nNEXT_PUBLIC_LOCAL_FIRST_EDITOR=false\n', '\n')
          if '# Local-first editor (Phase 4, EXPERIMENTAL).' not in env_text:
              marker = 'NEXT_PUBLIC_CHAT_PROVIDER=gemini\n\n'
              if marker in env_text:
                  env_text = env_text.replace(marker, marker + local_first_env + '\n', 1)
              else:
                  env_text = env_text.rstrip() + '\n\n' + local_first_env
          env.write_text(env_text)

          workflow = Path('.github/workflows/apply-local-first-once.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/editor/page.tsx .env.example .github/workflows/apply-local-first-once.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Apply Phase 4 local-first page wiring"
            git push origin HEAD:main
          fi
